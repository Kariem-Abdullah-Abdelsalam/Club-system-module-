name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-club_system-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      BENCH_PATH: /home/runner/frappe-bench
      SITE_NAME: test_site
      DB_ROOT_PASSWORD: root
      ADMIN_PASSWORD: admin

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mariadb-client \
            libmariadb-dev \
            pkg-config

      - name: Install frappe-bench
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "click<8.2" frappe-bench
          bench --version

      - name: Initialize bench
        run: |
          bench init \
            --frappe-branch version-15 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            "$BENCH_PATH"

      - name: Configure Redis and MariaDB
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:11000"

          mariadb \
            --host 127.0.0.1 \
            --port 3306 \
            -u root \
            -p"$DB_ROOT_PASSWORD" \
            --skip-ssl \
            -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install application
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          bench get-app --skip-assets club_system "$GITHUB_WORKSPACE"
          bench setup requirements --dev

          bench new-site "$SITE_NAME" \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD"

          bench --site "$SITE_NAME" install-app club_system
          bench --site "$SITE_NAME" migrate

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        env:
          TYPE: server
        run: |
          bench --site "$SITE_NAME" set-config allow_tests true
          if grep -rn "def test" ./apps/club_system --include="*.py" > /dev/null 2>&1; then
            bench --site "$SITE_NAME" run-tests --app club_system
          else
            echo "No test cases detected in club_system. Skipping execution."
          fi
