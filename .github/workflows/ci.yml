name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-club_system-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Server Tests

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10

      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10

      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for tests (non-blocking)
        run: |
          if grep -rn "def test" . --include="*.py" > /dev/null 2>&1; then
            echo "Tests found"
          else
            echo "No tests found, skipping test run"
            echo "SKIP_TESTS=true" >> $GITHUB_ENV
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml
            **/setup.py
            **/setup.cfg

      - name: Setup Node (for Frappe asset building)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config

      - name: Install frappe-bench (pinned version)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "frappe-bench==5.22.0"

      - name: Initialize bench
        run: |
          bench init --frappe-branch version-15 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench

      - name: Configure Redis for bench
        working-directory: /home/runner/frappe-bench
        run: |
          bench setup redis
          # Update redis cache config
          bench set-config -g redis_cache "redis://localhost:13000"
          # Update redis queue config
          bench set-config -g redis_queue "redis://localhost:11000"
          # Update redis socketio config (if needed)
          bench set-config -g redis_socketio "redis://localhost:11000"

      - name: Wait for MariaDB to be ready
        run: |
          for i in {1..30}; do
            if mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SELECT 1" >/dev/null 2>&1; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done

      - name: Configure MariaDB charset
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install app and setup site
        working-directory: /home/runner/frappe-bench
        run: |
          # Get the app from workspace
          bench get-app club_system "$GITHUB_WORKSPACE"
          
          # Install base requirements first
          bench setup requirements
          # Then dev requirements
          bench setup requirements --dev
          
          # Create site
          bench new-site test_site \
            --db-root-password root \
            --admin-password admin \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306
          
          # Enable developer mode and allow tests
          bench --site test_site set-config developer_mode 1
          bench --site test_site set-config allow_tests true
          
          # Install app
          bench --site test_site install-app club_system
          
          # CRITICAL: Run migrations to create tables
          bench --site test_site migrate
          
          # Build assets
          bench build

      - name: Run Tests
        if: env.SKIP_TESTS != 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --app club_system

      - name: Run Tests (verbose on failure)
        if: failure() && env.SKIP_TESTS != 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --app club_system --verbose 2>&1 | tail -100
